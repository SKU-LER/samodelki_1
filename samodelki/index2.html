<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мастерская — электронные самоделки</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eef1f5;color:#1f2937;line-height:1.5}
  header{background:linear-gradient(135deg,#0f172a,#1e40af);color:#fff;padding:28px 16px;text-align:center}
  header h1{font-size:1.7rem}
  header p{opacity:.85;margin-top:4px}
  .tools{max-width:1100px;margin:16px auto;padding:0 16px;display:flex;flex-wrap:wrap;gap:10px}
  .tools input,.tools select{padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;background:#fff}
  .tools input{flex:1;min-width:200px}
  .grid{max-width:1100px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .card{background:#fff;border-radius:12px;padding:16px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08);transition:.15s}
  .card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.14)}
  .card .ic{font-size:2.2rem}
  .card h3{margin:6px 0;font-size:1.05rem}
  .card p{font-size:.9rem;color:#475569}
  .tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:#e2e8f0}
  .easy{background:#bbf7d0}.medium{background:#fde68a}.hard{background:#fecaca}
  .empty{grid-column:1/-1;text-align:center;color:#64748b;padding:40px}
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.65);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px;z-index:10}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:22px;position:relative}
  .close{position:absolute;right:12px;top:8px;font-size:2rem;border:0;background:none;cursor:pointer;color:#64748b}
  .modal h2{margin-bottom:6px;padding-right:30px}
  .modal h4{margin:20px 0 8px;font-size:1.05rem;color:#1e40af}
  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .blk{padding:8px 12px;border-radius:8px;font-size:.88rem;font-weight:600;border:2px solid;text-align:center}
  .power{background:#fee2e2;border-color:#ef4444}
  .input{background:#dbeafe;border-color:#3b82f6}
  .ctrl{background:#fef9c3;border-color:#eab308}
  .out{background:#dcfce7;border-color:#22c55e}
  .arr{font-size:1.3rem;color:#64748b}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:.78rem}
  .legend span{padding:2px 8px;border-radius:6px;border:2px solid}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  td,th{border:1px solid #e2e8f0;padding:6px 8px;text-align:left}
  th{background:#f1f5f9}
  td.mid{text-align:center;width:40px;color:#64748b}
  ul,ol{padding-left:22px}
  li{margin:3px 0}
  .tip{margin-top:16px;background:#fff7ed;border-left:4px solid #f97316;padding:10px 12px;border-radius:6px;font-size:.92rem}
</style>
</head>
<body>
<header>
  <h1>⚡ Мастерская самоделок</h1>
  <p>Простые электронные схемы с понятным описанием соединений</p>
</header>

<div class="tools">
  <input id="q" type="search" placeholder="Поиск: мигалка, датчик, усилитель...">
  <select id="cat"></select>
  <select id="dif">
    <option value="">Любая сложность</option>
    <option value="easy">Лёгкая</option>
    <option value="medium">Средняя</option>
    <option value="hard">Сложная</option>
  </select>
</div>

<div class="grid" id="grid"></div>

<div class="overlay" id="ov">
  <div class="modal" id="modal"></div>
</div>

<script>

{

  steps:["Закрепите электроды на разной высоте.","Общий электрод опустите до дна.","Подключите три транзисторных каскада.","Залейте воду и проверьте свечение."],
  tip:"Используйте переменный ток или нержавейку, чтобы электроды не разъедало."
},
{

  desc:"Питание телефона от автомобильного аккумулятора.",
  flow:[["power","Вход 12 В"],["ctrl","Предохранитель + диод"],["ctrl","Стабилизатор 7805"],["out","Разъём USB"]],
  parts:["7805","Конденсатор 330 нФ","Конденсатор 100 нФ","Диод 1N4007","Предохранитель 1 А","Разъём USB"],
  conn:[["+12 В","Предохранитель → диод → вход 7805"],["Конденсатор 330 нФ","Между входом и землёй"],["Выход 7805","USB VBUS (контакт 1)"],["Конденсатор 100 нФ","Между выходом и землёй"],["Земля","USB GND (контакт 4)"]],
  steps:["Подключите вход через предохранитель и диод.","Припаяйте конденсаторы к ножкам 7805.","Подключите USB-разъём.","Проверьте 5 В мультиметром до подключения телефона."],
  tip:"7805 сильно греется при токе выше 0,5 А. Поставьте радиатор или используйте импульсный модуль."
},
{

  desc:"Мультивибратор, который издаёт громкий переливающийся звук.",

var grid = document.getElementById("grid");
var q = document.getElementById("q");
var cat = document.getElementById("cat");
var dif = document.getElementById("dif");
var ov = document.getElementById("ov");
var modal = document.getElementById("modal");

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&","<":"<",">":">",'"':"""}[c]; }); }

(function initCats(){
  var cats = [];
  P.forEach(function(p){ if(cats.indexOf(p.cat) < 0) cats.push(p.cat); });
  cat.innerHTML = '<option value="">Все категории</option>' +
    cats.map(function(c){ return '<option>' + esc(c) + '</option>'; }).join("");
})();

function render(){
  var t = q.value.trim().toLowerCase();
  var list = P.map(function(p,i){ p.i = i; return p; }).filter(function(p){
    if(cat.value && p.cat !== cat.value) return false;
    if(dif.value && p.diff !== dif.value) return false;
    if(!t) return true;
    var hay = (p.title + " " + p.desc + " " + p.parts.join(" ")).toLowerCase();
    return hay.indexOf(t) >= 0;
  });
  if(!list.length){ grid.innerHTML = '<div class="empty">Ничего не найдено 😕</div>'; return; }
  grid.innerHTML = list.map(function(p){
    return '<div class="card" onclick="openP(' + p.i + ')">' +
      '<div class="ic">' + p.icon + '</div>' +
      '<h3>' + esc(p.title) + '</h3>' +
      '<p>' + esc(p.desc) + '</p>' +
      '<div class="tags"><span class="tag">' + esc(p.cat) + '</span>' +
      '<span class="tag ' + p.diff + '">' + DIFF[p.diff] + '</span></div></div>';
  }).join("");
}

function openP(i){
  var p = P[i];
  var flow = p.flow.map(function(b){
    return '<div class="blk ' + b[0] + '">' + esc(b[1]) + '</div>';
  }).join('<span class="arr">➜</span>');
  var conn = p.conn.map(function(c,n){
    return '<tr><td>' + (n+1) + '</td><td>' + esc(c[0]) + '</td><td class="mid">→</td><td>' + esc(c[1]) + '</td></tr>';
  }).join("");
  modal.innerHTML =
    '<button class="close" onclick="closeP()">×</button>' +
    '<h2>' + p.icon + ' ' + esc(p.title) + '</h2>' +
    '<div class="tags"><span class="tag">' + esc(p.cat) + '</span><span class="tag ' + p.diff + '">' + DIFF[p.diff] + '</span></div>' +
    '<p style="margin-top:8px">' + esc(p.desc) + '</p>' +
    '<h4>🗺️ Блок-схема</h4><div class="flow">' + flow + '</div>' +
    '<div class="legend"><span class="power">Питание</span><span class="input">Вход / датчик</span><span class="ctrl">Управление</span><span class="out">Выход</span></div>' +
    '<h4>🔗 Что куда подключать</h4>' +
    '<table><tr><th>№</th><th>Откуда</th><th></th><th>Куда</th></tr>' + conn + '</table>' +
    '<h4>🧰 Детали</h4><ul>' + p.parts.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>' +
    '<h4>🛠️ Порядок сборки</h4><ol>' + p.steps.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ol>' +
    '<div class="tip">💡 ' + esc(p.tip) + '</div>';
  ov.classList.add("open");
  ov.scrollTop = 0;
}
function closeP(){ ov.classList.remove("open"); }

ov.addEventListener("click", function(e){ if(e.target === ov) closeP(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeP(); });
q.addEventListener("input", render);
cat.addEventListener("change", render);
dif.addEventListener("change", render);
render();
</script>
</body>
</html>
